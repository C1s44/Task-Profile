name: Send Telegram Notification

on:
  push:
    branches: [ "main" ] # Ubah ke 'master' jika branch utama kamu bernama master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Message to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          MESSAGE="🚀 <b>Commit Baru!</b>%0A%0A<b>Repository:</b> ${{ github.repository }}%0A<b>Author:</b> ${COMMIT_AUTHOR}%0A<b>Pesan:</b> ${COMMIT_MSG}%0A%0A<a href=\"${COMMIT_URL}\">Lihat Commit</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_TO}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
            
